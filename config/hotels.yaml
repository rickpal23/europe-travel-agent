# Hotel data for each supported city.
# Fields:
#   hotel           - property name shown in the UI
#   room_type       - recommended room for a family of 4
#   sqft            - approximate room size (used in scoring)
#   fits_family_of_4 - true if one room comfortably sleeps 4
#   cash_per_night  - rough rack rate in USD (used when certs/points run out)
#   points_per_night - Bonvoy points for a standard redemption
#   rating          - reviewer score 0-5 (used in hotel-quality scoring)
#   brand           - Marriott portfolio brand name
#   kid_notes       - family-specific activity tips shown in the day-by-day plan

London:
  hotel: London Marriott Hotel County Hall
  room_type: "1-Bedroom Suite (king + sofa bed for kids)"
  sqft: 650
  fits_family_of_4: true
  cash_per_night: 580
  points_per_night: 100000
  rating: 4.6
  brand: Marriott
  kid_notes: >-
    Right next to the London Eye and Big Ben. Easy walks to Tower of London.
    Day trip to Warner Bros. Harry Potter Studios is a hit with both 11 and 14.

Paris:
  hotel: Paris Marriott Opera Ambassador
  room_type: Junior Suite with sofa bed
  sqft: 480
  fits_family_of_4: true
  cash_per_night: 520
  points_per_night: 90000
  rating: 4.5
  brand: Marriott
  kid_notes: >-
